<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Maugli Bodywork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <style>
    :root {
      --bg: #15110D;
      --bg-2: #1E1A14;
      --bg-card: #231F18;
      --text: #F0E8DE;
      --text-soft: #C8BFB4;
      --muted: #7A6E64;
      --accent: #D77A5B;
      --sage: #5C7A62;
      --line: #2A241E;
      --danger: #C0392B;
      --success: #5C7A62;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Geologica', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.035;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .logo span { color: var(--accent); }

    /* ── Auth ── */
    #authBlock {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 40px;
      max-width: 420px;
      margin: 80px auto 0;
    }

    #authBlock h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    #authBlock p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 13px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="password"],
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Geologica', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Geologica', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.85; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-soft);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

    .auth-error {
      margin-top: 12px;
      color: #e07070;
      font-size: 13px;
      display: none;
    }

    /* ── Main ── */
    #mainBlock { display: none; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Unbounded', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
    }

    .stat-card.accent .stat-value { color: var(--accent); }
    .stat-card.sage .stat-value { color: var(--sage); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text-soft);
      border-radius: 20px;
      font-family: 'Geologica', sans-serif;
      font-size: 12px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .spacer { flex: 1; }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    tbody td {
      padding: 12px 16px;
      color: var(--text-soft);
      font-size: 13px;
      vertical-align: middle;
    }

    td.name { color: var(--text); font-weight: 500; }
    td.id-col { color: var(--muted); font-size: 12px; font-family: monospace; }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .badge-new      { background: rgba(215,122,91,0.15); color: var(--accent); }
    .badge-activated { background: rgba(92,122,98,0.2); color: #7eb385; }
    .badge-booked   { background: rgba(92,122,98,0.35); color: #9ecfa6; }

    /* ── Empty ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Last updated ── */
    .last-updated {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      #authBlock { padding: 28px 20px; margin-top: 40px; }
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="logo">Maugli Bodywork <span>/ Admin</span></div>
    <div id="headerActions" style="display:none; gap:10px; display:none; align-items:center; flex-wrap:wrap;">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="btn btn-ghost" onclick="refreshData()">↻ Обновить</button>
      <button class="btn btn-ghost" onclick="exportCSV()">↓ CSV</button>
      <button class="btn btn-ghost" onclick="logout()" style="color:#e07070;border-color:#5a2020;">Выйти</button>
    </div>
  </div>

  <!-- AUTH -->
  <div id="authBlock">
    <h2>Вход в панель</h2>
    <p>Введи токен администратора</p>
    <div class="input-row">
      <input type="password" id="tokenInput" placeholder="Admin token" autocomplete="current-password">
      <button class="btn" onclick="doLogin()">Войти</button>
    </div>
    <div class="auth-error" id="authError">Неверный токен</div>
  </div>

  <!-- MAIN -->
  <div id="mainBlock">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Всего лидов</div>
        <div class="stat-value" id="sTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Только форма</div>
        <div class="stat-value" id="sFresh">—</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label">Активированы</div>
        <div class="stat-value" id="sActivated">—</div>
      </div>
      <div class="stat-card sage">
        <div class="stat-label">Записались</div>
        <div class="stat-value" id="sBooked">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
        <button class="filter-btn" onclick="setFilter('fresh', this)">Только форма</button>
        <button class="filter-btn" onclick="setFilter('activated', this)">Активированы</button>
        <button class="filter-btn" onclick="setFilter('booked', this)">Записались</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div class="loading" id="tableLoading"><span class="spinner"></span> Загружаю...</div>
      <table id="leadsTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Имя</th>
            <th>Telegram</th>
            <th>Источник</th>
            <th>Дата формы</th>
            <th>Активация</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
      <div class="empty" id="tableEmpty" style="display:none;">Нет лидов по этому фильтру</div>
    </div>
  </div>
</div>

<script>
  const API = 'https://mauglibodywork.com/api/admin/leads';
  let allLeads = [];
  let currentFilter = 'all';

  // ── Auth ──
  function savedToken() { return localStorage.getItem('mbw_admin_token') || ''; }

  async function doLogin() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) return;
    const ok = await fetchLeads(token);
    if (ok) {
      localStorage.setItem('mbw_admin_token', token);
      showMain();
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }

  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function logout() {
    localStorage.removeItem('mbw_admin_token');
    location.reload();
  }

  // ── Data ──
  async function fetchLeads(token) {
    try {
      const resp = await fetch(`${API}?token=${encodeURIComponent(token)}`);
      if (resp.status === 401) return false;
      const data = await resp.json();
      allLeads = data.leads || [];
      updateStats(data.stats || {});
      renderTable();
      document.getElementById('lastUpdated').textContent =
        'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function refreshData() {
    await fetchLeads(savedToken());
  }

  // ── Stats ──
  function updateStats(s) {
    document.getElementById('sTotal').textContent     = s.total     ?? '—';
    document.getElementById('sFresh').textContent     = s.fresh     ?? '—';
    document.getElementById('sActivated').textContent = s.activated ?? '—';
    document.getElementById('sBooked').textContent    = s.booked    ?? '—';
  }

  // ── Filters ──
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function filteredLeads() {
    if (currentFilter === 'fresh')     return allLeads.filter(l => !l.tg_id);
    if (currentFilter === 'activated') return allLeads.filter(l => l.activated_at);
    if (currentFilter === 'booked')    return allLeads.filter(l => l.booked);
    return allLeads;
  }

  // ── Table ──
  function renderTable() {
    document.getElementById('tableLoading').style.display = 'none';
    const leads = filteredLeads();
    const tbody = document.getElementById('leadsBody');
    const table = document.getElementById('leadsTable');
    const empty = document.getElementById('tableEmpty');

    if (!leads.length) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    tbody.innerHTML = leads.map(l => {
      const tg = l.tg_username
        ? `<a href="https://t.me/${l.tg_username.replace('@','')}" target="_blank" style="color:var(--accent);text-decoration:none;">${l.tg_username}</a>`
        : l.tg_id
          ? `<span style="color:var(--muted);font-family:monospace;">${l.tg_id}</span>`
          : '<span style="color:var(--muted);">—</span>';

      const badge = l.booked
        ? '<span class="badge badge-booked">Записан</span>'
        : l.activated_at
          ? '<span class="badge badge-activated">Активирован</span>'
          : '<span class="badge badge-new">Новый</span>';

      const formDate  = l.form_at      ? fmtDate(l.form_at)      : '—';
      const activDate = l.activated_at ? fmtDate(l.activated_at) : '—';

      return `<tr>
        <td class="id-col">${l.id}</td>
        <td class="name">${esc(l.name)}</td>
        <td>${tg}</td>
        <td style="color:var(--muted);font-size:12px;">${l.source || '—'}</td>
        <td>${formDate}</td>
        <td>${activDate}</td>
        <td>${badge}</td>
      </tr>`;
    }).join('');
  }

  // ── CSV ──
  function exportCSV() {
    const leads = filteredLeads();
    if (!leads.length) return;
    const cols = ['id','name','tg_id','tg_username','source','form_at','activated_at','booked'];
    const header = cols.join(',');
    const rows = leads.map(l =>
      cols.map(c => {
        const v = l[c] ?? '';
        return typeof v === 'string' && (v.includes(',') || v.includes('"') || v.includes('\n'))
          ? `"${v.replace(/"/g, '""')}"` : v;
      }).join(',')
    );
    const csv = [header, ...rows].join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mbw_leads_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── UI ──
  function showMain() {
    document.getElementById('authBlock').style.display = 'none';
    document.getElementById('mainBlock').style.display = 'block';
    const ha = document.getElementById('headerActions');
    ha.style.display = 'flex';
  }

  // ── Utils ──
  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit',
        timeZone: 'Asia/Tbilisi'
      });
    } catch { return iso; }
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Init: auto-login if token saved ──
  (async () => {
    const token = savedToken();
    if (token) {
      const ok = await fetchLeads(token);
      if (ok) showMain();
    }
  })();
</script>
</body>
</html>
