<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Notes from a body practitioner — coming soon." />
  <meta name="theme-color" content="#F4EFE7" />
  <title>Journal — Maugli Bodywork</title>
  <link rel="icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4EFE7; --bg-2: #FAF6F0; --bg-dark: #1A1510;
      --text: #1A1510; --text-soft: #2C2620; --muted: #8A7D72;
      --accent: #C4694A; --line: #D8CFC4; --white: #FAF6F0;
    }
    [data-theme="dark"] {
      --bg: #15110D; --bg-2: #1E1A14; --bg-dark: #0B0908;
      --text: #F0E8DE; --text-soft: #D8CFC4; --muted: #8A7D72;
      --accent: #D77A5B; --line: #2A241E; --white: #F0E8DE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Geologica', sans-serif; font-weight: 300;
      line-height: 1.6; min-height: 100vh;
      display: flex; flex-direction: column;
      transition: background 0.4s ease, color 0.3s ease;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 999; opacity: 0.035;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
    }
    [data-theme="dark"] body::before { opacity: 0.06; mix-blend-mode: screen; }
    a { color: inherit; text-decoration: none; }

    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 1.4rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
    }
    .logo { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { font-size: 0.83rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a.current { color: var(--accent); }
    .lang-switch { display: flex; align-items: center; gap: 0.4rem; }
    .lang-btn {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); padding: 0.28rem 0.55rem; border: 1px solid transparent; border-radius: 3px;
    }
    .lang-btn.active { color: var(--accent); border-color: var(--accent); pointer-events: none; }
    .lang-sep { font-size: 0.55rem; color: var(--line); }

    .placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 8rem 2rem;
    }
    .placeholder-tag {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1.5rem;
    }
    .placeholder-title {
      font-family: 'Unbounded', sans-serif; font-weight: 700;
      font-size: clamp(2.5rem, 5vw, 4rem); letter-spacing: -0.025em;
      line-height: 1.05; margin-bottom: 1.5rem;
    }
    .placeholder-text {
      font-size: 1.05rem; color: var(--muted);
      max-width: 480px; line-height: 1.7; margin-bottom: 2.5rem;
    }
    .placeholder-link {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); border-bottom: 1px solid var(--accent);
      padding-bottom: 0.2rem;
    }

    @media (max-width: 860px) {
      .nav { padding: 1.2rem 1.4rem; }
      .nav-links a:not(.logo) { display: none; }
      .placeholder { padding: 6rem 1.4rem; }
    }
  </style>
  <script>
    (function() { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();
  </script>
</head>
<body>
  <nav class="nav">
    <a href="../index.html" class="logo">Maugli Bodywork</a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../services.html">Services</a>
      <a href="../about.html">About</a>
      <a href="index.html" class="current">Journal</a>
      <a href="../contacts.html">Contacts</a>
      <div class="lang-switch"><a href="../../journal/index.html" class="lang-btn">RU</a><span class="lang-sep">/</span><span class="lang-btn active">EN</span></div>
    </div>
  </nav>

  <main class="placeholder">
    <p class="placeholder-tag">Journal</p>
    <h1 class="placeholder-title">Coming<br>soon</h1>
    <p class="placeholder-text">Notes from my practice — on anatomy, exercises, and working with the body — will be available here in English soon.</p>
    <a href="../../journal/index.html" class="placeholder-link">Read in Russian →</a>
  </main>
</body>
</html>
